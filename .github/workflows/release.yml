name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # darwin/amd64 and darwin/arm64 are both built on macos-latest:
          # Apple's clang is a universal toolchain, so CGO cross-arch works
          # without an extra C cross-compiler.
          - runner: macos-latest
            goos: darwin
            goarch: amd64
          - runner: macos-latest
            goos: darwin
            goarch: arm64
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
          # linux/arm64 uses a native arm64 GitHub-hosted runner instead of
          # cross-compiling CGO from an amd64 host, so DuckDB (which needs
          # CGO) doesn't have to be gated off this target.
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: build --single-target --clean

      - name: Package archive
        run: |
          set -euo pipefail
          name="lazysql_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}"
          bin_dir=$(find dist -mindepth 1 -maxdepth 1 -type d -name 'lazysql_*')
          mkdir -p "release/${name}"
          cp "${bin_dir}/lazysql" "release/${name}/"
          cp README.md "release/${name}/"
          tar -C release -czf "release/${name}.tar.gz" "${name}"
          (cd release && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: lazysql-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            release/*.tar.gz
            release/*.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: Combine checksums
        run: cat dist-release/*.sha256 > dist-release/checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist-release/*.tar.gz
            dist-release/checksums.txt
