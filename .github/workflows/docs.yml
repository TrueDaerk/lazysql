# Builds the user documentation site (issue #146) as a pull-request check.
# Deployment is NOT done in CI (issue #148): publishing to GitHub Pages is a
# local, manual step (`make docs-deploy`) that force-pushes the built site to
# the `gh-pages` branch, which the repository's Pages settings serve from
# ("Deploy from a branch" → gh-pages → /root).

name: Documentation

on:
  pull_request:
    paths:
      - "userdocs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: userdocs/requirements.txt

      - name: Install MkDocs
        run: pip install -r userdocs/requirements.txt

      # --strict turns broken links and warnings into build failures.
      - name: Build site
        run: mkdocs build --strict
